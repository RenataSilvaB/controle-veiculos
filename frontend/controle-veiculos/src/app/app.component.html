
<div class="container">
  <h1>Controle de Veículos</h1>

  <p>Gerencie os veículos cadastrados no sistema.</p>

  <h2>Veículos cadastrados</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Ano</th>
        <th>Placa</th>
        <th>Cor</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let veiculo of veiculos">
        <td>{{ veiculo.id }}</td>
        <td>{{ veiculo.marca }}</td>
        <td>{{ veiculo.modelo }}</td>
        <td>{{ veiculo.ano }}</td>
        <td>{{ veiculo.placa }}</td>
        <td>{{ veiculo.cor }}</td>
        <td>{{ veiculo.status }}</td>
      </tr>
    </tbody>
  </table>
</div>
