<div class="container">
  <h1>Controle de Veículos</h1>

  <p>Gerencie os veículos cadastrados no sistema.</p>

  <button (click)="mostrarFormulario = !mostrarFormulario">Novo veículo</button>

  <div *ngIf="mostrarFormulario" class="formulario">
    <h2>Cadastrar veículo</h2>

    <form (ngSubmit)="cadastrarVeiculo()">
      <input
        type="text"
        name="marca"
        placeholder="Marca"
        [(ngModel)]="novoVeiculo.marca"
        required
      />

      <input
        type="text"
        name="modelo"
        placeholder="Modelo"
        [(ngModel)]="novoVeiculo.modelo"
        required
      />

      <input
        type="number"
        name="ano"
        placeholder="Ano"
        [(ngModel)]="novoVeiculo.ano"
        required
      />

      <input
        type="text"
        name="placa"
        placeholder="Placa"
        [(ngModel)]="novoVeiculo.placa"
        required
      />

      <input
        type="text"
        name="cor"
        placeholder="Cor"
        [(ngModel)]="novoVeiculo.cor"
        required
      />

      <select name="status" [(ngModel)]="novoVeiculo.status">
        <option value="Disponível">Disponível</option>
        <option value="Vendido">Vendido</option>
      </select>

      <button type="submit">
        {{ veiculoEditandoId ? "Atualizar veículo" : "Salvar veículo" }}
      </button>
    </form>
  </div>
  <h2>Veículos cadastrados</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Ano</th>
        <th>Placa</th>
        <th>Cor</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let veiculo of veiculos">
        <td>{{ veiculo.id }}</td>
        <td>{{ veiculo.marca }}</td>
        <td>{{ veiculo.modelo }}</td>
        <td>{{ veiculo.ano }}</td>
        <td>{{ veiculo.placa }}</td>
        <td>{{ veiculo.cor }}</td>
        <td>{{ veiculo.status }}</td>
        <td>
           <div class="acoes">
          <button (click)="editarVeiculo(veiculo)">Editar</button>
        <button (click)="excluirVeiculo(veiculo.id)">Excluir</button>
        </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
